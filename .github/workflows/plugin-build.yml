name: Plugin Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          cp -R sheet-stock-sync-woo build/sheet-stock-sync-woo
          cd build
          zip -qr woo-hoo-manager.zip sheet-stock-sync-woo
          test -s woo-hoo-manager.zip
          unzip -l woo-hoo-manager.zip | grep -q 'sheet-stock-sync-woo/sheet-stock-sync-woo.php'

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: woo-hoo-manager-wordpress-plugin
          path: build/woo-hoo-manager.zip
          if-no-files-found: error
          retention-days: 30
