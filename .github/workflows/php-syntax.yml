name: PHP Syntax

on:
  push:
    branches:
      - main
      - phase-0-baseline-foundation
  pull_request:

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.1'
          - '8.3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate all PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find sheet-stock-sync-woo -type f -name '*.php' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No PHP files found under sheet-stock-sync-woo/' >&2
            exit 1
          fi
          printf 'Checking %s PHP files\n' "${#files[@]}"
          for file in "${files[@]}"; do
            php -l "$file"
          done
