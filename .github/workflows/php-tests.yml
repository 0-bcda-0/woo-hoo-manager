name: PHP Tests

on:
  pull_request:
  push:
    branches:
      - main
      - phase-0-db-migrations
      - phase-1-suppliers
      - phase-2-location-ledger
      - phase-3-purchase-orders
      - phase-4-barcode-workflows
      - phase-5-analytics-aggregation
      - phase-6-demand-forecasting
      - phase-7-inventory-intelligence
      - phase-8-bundle-recommendations
      - phase-9-smart-alerts
      - phase-10-operations-cockpit
      - phase-11-90-day-planning
      - phase-12-what-if-simulator

jobs:
  foundation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['7.4', '8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Run database foundation test
        run: php tests/test-db-foundation.php
      - name: Run supplier domain test
        run: php tests/test-suppliers.php
      - name: Run location ledger test
        run: php tests/test-location-ledger.php
      - name: Run purchase order workflow test
        run: php tests/test-purchase-orders.php
      - name: Run barcode workflow test
        run: php tests/test-barcodes.php
      - name: Run analytics aggregation test
        run: php tests/test-analytics-aggregation.php
      - name: Run analytics job policy test
        run: php tests/test-analytics-jobs.php
      - name: Run demand forecasting test
        run: php tests/test-demand-forecasting.php
      - name: Run metrics engine test
        run: php tests/test-metrics-engine.php
      - name: Run approved inventory intelligence test
        run: php tests/test-inventory-intelligence.php
      - name: Run approved bundle recommendation test
        run: php tests/test-bundle-recommendations.php
      - name: Run approved smart alert test
        run: php tests/test-smart-alerts.php
      - name: Run approved operations cockpit test
        run: php tests/test-action-center.php
      - name: Run approved 90-day purchasing planner test
        run: php tests/test-purchasing-planner.php
      - name: Run approved what-if simulator test
        run: php tests/test-what-if-simulator.php
